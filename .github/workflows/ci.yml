name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Capability audit (every capability wired or waived)
        # The two gaps this guards against — capabilities nobody granted, and a stale
        # local copy of the catalogue — both grew silently because nothing checked.
        run: python3 scripts/capability-audit.py --check

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Tests (offline, no eval)
        # `live` hits real endpoints; `eval` is scheduled — neither runs in default CI.
        run: pytest -m "not live and not eval"

  test-postgres:
    # Prod-dialect coverage: the integration suite against a real Postgres
    # (JSON/Numeric/timezone semantics differ from SQLite).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: agents
          POSTGRES_DB: agents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install (editable + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Integration tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://agents:agents@localhost:5432/agents_test
        run: pytest -m integration
