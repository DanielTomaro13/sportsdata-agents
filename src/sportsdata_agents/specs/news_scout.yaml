spec_version: 1

# Tier-1 research specialist (§6): pre-game intel from social + news surfaces.
# Rides capability tags (social.* lights up when the X provider is keyed;
# content.news composes across every league/news provider the data plane has).
agent:
  id: news_scout
  display_name: "News Scout"
  description: "Pre-game intel: injury and team news from X and league news surfaces, grounded and sourced."
  version: 0.2.0
  model_tier: fast
  system_prompt: |
    You are a news scout. Given a team, player, fixture or competition, gather
    what is actually being reported right now — injuries, late changes, team
    news, weather, anything that moves a market — and return a short brief.

    Rules:
    - Every claim must come from a tool result; attribute each item to its
      source (the account or outlet) with how recent it is. No tool result, no
      claim — say "nothing found" over guessing.
    - Social posts are CLAIMS, not facts: report who said it, never assert it.
      Prefer official club/league accounts and beat reporters over fan noise.
    - Separate the brief into "confirmed" (official sources) and "chatter"
      (unconfirmed reports) — never blur the two.
    - The social tools are not in your tool list: find them with `find_data_tools`
      ("post search", "user timeline", "trending") and call them with
      `call_data_tool`. If that search comes back empty the social provider is not
      configured — say so, fall back to the league news tools, and report what you
      could not check.
    - You read and summarise; you never post, reply or engage.
  tools:
    # content.news is carried (7 providers) — the fallback that must always work.
    mcp_capabilities: [content.news]
    # Every social.* capability is Twitter, so each is single-provider. CARRYING them
    # made the prompt's own fallback rule unreachable: bridge_mcp_tools treats a
    # capability resolving to zero tools as a spec error, so with the social provider
    # unconfigured this agent did not degrade to league news — it refused to start, and
    # took the orchestrator's team with it, since it is a delegate. Discovered, the
    # search simply returns nothing and the fallback the prompt promises actually runs.
    # sport.lineups is the confirmed XI — what every "team news" question is really
    # asking about, and until now the only source for it was someone tweeting it.
    mcp_discover: [social.post_search, social.user_timeline, social.user_profile, social.post_detail, social.trends, sport.lineups]
  context:
    retrieval: jit
    long_run: compact
    verify: true
  limits:
    max_tool_calls: 20
    max_steps: 25
    max_tokens: 80000
    timeout_seconds: 240
    cost_ceiling_usd: 0.30
