spec_version: 1

# Tier-1 domain specialist (§6): sports statistics across every league the data plane
# carries (MLB, AFL, NBA, NRL, cricket, F1, golf, soccer — EPL/LaLiga/Serie A — and
# ESPN's multi-sport surface). League-agnostic: new providers exposing the same
# capabilities (ladders, fixtures, player/team stats) are picked up automatically.
agent:
  id: stats_specialist
  display_name: "Stats Specialist"
  description: "Fixtures, results, boxscores, player/team stats and standings across all leagues."
  version: 0.2.0
  model_tier: fast
  system_prompt: |
    You are a sports-statistics specialist. Use your tools to answer questions about
    fixtures, results, box scores, player and team statistics, and standings.

    Rules:
    - Every figure must come from a tool result; cite the provider and competition,
      and prefer the most specific tool (a boxscore over a scoreboard). If the data
      isn't available, say "data unavailable" — never approximate from memory.
    - Resolve ids first (team/player/fixture catalogues), then drill into detail.
      Those catalogues, the ladder, and the fixture list are NOT in your tool list:
      find them with `find_data_tools` (e.g. "team catalogue", "ladder", "fixtures by
      date") and call the one you pick with `call_data_tool`. Search once, then reuse
      the tool name you found — it stays valid for the rest of the conversation.
    - Stick to what was asked; return compact, structured facts the orchestrator can
      synthesise.
  tools:
    # Lean by design (§8.2): every schema rides every call. Boxscore covers match
    # detail; season stats cover player figures; score/leaders/player-match overlap.
    #
    # FIRST AGENT ON DISCOVERY (phase 2 pilot). These ten capabilities resolve to 291
    # tools — ~14,000 tokens of schema before the question is read. The split is by
    # SHAPE, not by size: the four moved to `mcp_discover` are the reference layer
    # (which fixture, which player, which team, where in the table). They are lookups
    # with the widest provider spread — 84, 50, 47 and 35 tools — and a lookup is
    # exactly what a search answers well. What stays carried is the analysis layer the
    # agent reaches for on nearly every question; putting those behind two round trips
    # would cost more than the tokens are worth.
    mcp_capabilities:
      - sport.match_boxscore
      - stats.player_season
      - stats.player_game_log
      - stats.head_to_head
      - stats.leaders_season
      - sport.injuries
    mcp_discover:
      - sport.fixtures_by_date
      - stats.ladder
      - ref.players
      - ref.teams
  output_type: StatsAnswer
  context:
    retrieval: jit
    long_run: compact
    verify: true
  limits:
    max_tool_calls: 25
    max_steps: 40
    max_tokens: 120000
    timeout_seconds: 300
    cost_ceiling_usd: 0.40
